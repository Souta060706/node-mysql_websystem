<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルなTodoアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>私のTodoリスト</h1>

            <input type="text" id="todo-input" placeholder="新しいTodoを追加" required>
            <button type="submit">追加</button>
        </form>
        <ul id="todo-list">
            </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
